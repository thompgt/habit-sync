spring:
  application:
    name: habit-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habitsync}
    username: ${DB_USER:habitsync}
    password: ${DB_PASSWORD:habitsync}
    hikari:
      maximum-pool-size: 10
      # Sync pushes take a per-user row lock; a short timeout surfaces contention
      # as a fast 503 rather than a pile of stuck request threads.
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Deliberately NOT default-property-inclusion: non_null.
    #
    # In the sync protocol a null field value is meaningful data -- it is an explicitly
    # cleared field, as distinct from a field the change does not touch (absent key).
    # NON_NULL omits null map entries, which silently deletes every "clear this field"
    # operation from both the change_log payload and the HTTP response. The user clears
    # a habit's colour, the edit propagates nowhere, and nothing anywhere reports an
    # error.
    #
    # Tidier API responses are not worth a protocol that cannot express "set to null".
    default-property-inclusion: always

security:
  jwt:
    # No default. A fallback signing key is the kind of thing that ships to production
    # unnoticed, so the application refuses to start without one.
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    # Long, because an offline-first client whose session expires mid-offline-period
    # cannot push the work queued behind it until the user logs in again.
    refresh-token-ttl: P90D

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.thompgt.habitsync: DEBUG
