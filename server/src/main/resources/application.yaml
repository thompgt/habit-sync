spring:
  application:
    name: habit-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habitsync}
    username: ${DB_USER:habitsync}
    password: ${DB_PASSWORD:habitsync}
    hikari:
      maximum-pool-size: 10
      # Sync pushes take a per-user row lock; a short timeout surfaces contention
      # as a fast 503 rather than a pile of stuck request threads.
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.thompgt.habitsync: DEBUG
