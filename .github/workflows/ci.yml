name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # sync-core has no Docker or network dependencies, so it runs first and fails
      # fast. A broken merge function should not wait on Testcontainers to start.
      - name: sync-core tests
        run: ./gradlew :sync-core:test

      # The M6 convergence sweep. Also pure JVM, and it runs before the server suite for
      # the same reason: a merge that does not converge is a more fundamental failure than
      # anything Testcontainers is about to report, and it takes seconds to find out.
      - name: Convergence simulator
        run: ./gradlew :simulator:test

      - name: Full build (server tests use Testcontainers)
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build -f server/Dockerfile -t habit-sync-server:ci .

  # The iOS client's library targets and their tests. macOS rather than Linux because
  # HabitSyncClient uses the system SQLite module and the Keychain, neither of which exists
  # on the Linux toolchain; the screens themselves are compiled out with `#if os(iOS)` so
  # this job builds and tests the parts that hold the invariants.
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      # The port is only worth having if it decides conflicts identically to sync-core, so
      # these are the JVM suite's assertions in Swift: HLC ordering, merge's three algebraic
      # properties, the codec's null handling, and the round-trip loop against a fake server.
      - name: HabitSyncCore and HabitSyncClient tests
        working-directory: ios
        run: swift test
